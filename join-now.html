<body>
    <!-- JOIN NOW FORM SECTION -->
    <section class="login-form sign-up-form d-flex align-items-center">
        <div class="container wow fadeInUp" data-wow-duration="2s" data-wow-delay="0.05s">
            <div class="login-form-title text-center">
                <a href="index.html" class="d-inline-block">
                    <figure class="login-page-logo">
                        <img src="./assets/images/logo2x.png" alt="logo icon">
                    </figure>
                </a>
                <h2 class="text-size-80 text-white">Buat Akun GRATIS Anda</h2>
            </div>
            <div class="login-form-box">
                <div class="login-card">
                    <form class="" action="join-now.html" method="POST">
                        <div class="form-group">
                            <label for="exampleInputName1">Nama lengkap Anda</label>
                            <input class="input-field form-control" type="text" id="exampleInputName1" name="text"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="exampleInputEmail1">Email Anda</label>
                            <input class="input-field form-control" type="email" id="exampleInputEmail1" name="email"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="exampleInputPassword1">Masukkan kata sandi Anda <small>min. 6
                                    karakter</small></label>
                            <input class="input-field form-control" type="password" id="exampleInputPassword1"
                                name="password" required>
                        </div>
                        <div class="form-group">
                            <label for="inputNoncorehub">Bagaimana Anda mengetahui tentang Trimly?
                                <small>(opsional)</small></label>
                            <select id="inputNoncorehub" class="input-field form-control select-option">
                                <option selected>Silakan pilih interaksi pertama yang Anda ingat.</option>
                                <option value="online_community">Komunitas online (mis. GitHub, Reddit, Stack Overflow,
                                    Hacker News, ...)</option>
                                <option value="article">Artikel website, blog (bukan milik kami)</option>
                                <option value="review_sites">Situs ulasan (mis. G2, Capterra, ...)</option>
                                <option value="search">Mesin pencari (mis. Google, Bing, ...)</option>
                                <option value="mobile_app">Daftar toko aplikasi (App Store, Google Play)</option>
                                <option value="social">Media sosial (mis. Twitter / Quora / Facebook / LinkedIn...)
                                </option>
                                <option value="youtube">YouTube</option>
                                <option value="friend">Dari teman, kolega, ...</option>
                                <option value="message_groups">Grup pesan (mis. Discord, Slack, Telegram, ...)
                                </option>
                                <option value="events">Acara (mis. workshop, konferensi, atau pertemuan)</option>
                                <option value="podcast">Podcast</option>
                                <option value="other">Lainnya</option>
                            </select>
                        </div>
                        <div>
                            <label class="fw-normal mb-md-4 mb-3" style="cursor: pointer;">
                                <input class="checkbox" type="checkbox">
                                Beri tahu saya tentang fitur baru dan pembaruan (maks. dua kali sebulan)
                            </label>
                        </div>
                        <button type="submit" class="hover-effect btn btn-primary mb-0">Daftar Sekarang</button>
                    </form>
                </div>
                <div class="join-now-outer text-center">
                    <a href="login.html">Sudah punya akun?</a>
                </div>
